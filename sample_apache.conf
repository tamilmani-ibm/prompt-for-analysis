LoadModule ssl_module        modules/mod_ssl.so
LoadModule proxy_module      modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module    modules/mod_headers.so

<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
</IfModule>

# Only the trust store and verify depth are global. Nothing is enforced here.
<IfModule mod_ssl.c>
    SSLCACertificateFile ${TRUSTED_BUNDLE}
    SSLVerifyDepth       3

    # Backend TLS verification (Apache -> backend), only if backends use HTTPS
    SSLProxyEngine            On
    SSLProxyVerify            require
    SSLProxyVerifyDepth       3
    SSLProxyCheckPeerName     On
    SSLProxyCACertificateFile ${TRUSTED_BUNDLE}
</IfModule>


<VirtualHost *:443>
    ServerName app1.example.com

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/app1.crt
    SSLCertificateKeyFile /etc/pki/tls/private/app1.key

    # Ask for a client cert, but don't force it everywhere
    SSLVerifyClient optional

    # Open: health check (from health.conf, no cert needed)
    Include conf.d/health.conf

    # Open: public paths
    ProxyPass        /public https://backend1:8443/public
    ProxyPassReverse /public https://backend1:8443/public

    # Protected: client cert required
    <Location "/secure">
        Require ssl-verify-client
        RequestHeader set X-SSL-Client-DN "%{SSL_CLIENT_S_DN}s"
    </Location>
    ProxyPass        /secure https://backend1:8443/secure
    ProxyPassReverse /secure https://backend1:8443/secure

    <Location "/admin">
        Require ssl-verify-client
        # Optionally restrict to specific subjects:
        # Require expr "%{SSL_CLIENT_S_DN_CN} in {'admin-client','ops-client'}"
        RequestHeader set X-SSL-Client-DN "%{SSL_CLIENT_S_DN}s"
    </Location>
    ProxyPass        /admin https://backend1:8443/admin
    ProxyPassReverse /admin https://backend1:8443/admin

    # Default for everything else
    ProxyPass        / https://backend1:8443/
    ProxyPassReverse / https://backend1:8443/
</VirtualHost>
